<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LakkisStock | Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], display: ['Outfit','sans-serif'] } } } }
    </script>
    <style>
        body { font-family:'Inter',sans-serif; background:#050505; color:#fff; }
        .glass { background:rgba(20,20,20,0.6); border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(8px); }
        .ticket-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); transition:all .2s ease; }
        .ticket-card:hover { border-color:rgba(139,92,246,0.35); }
        .input-field { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); }
        .input-field:focus { outline:none; border-color:#8B5CF6; }
        .badge-open { background:rgba(234,179,8,0.15); color:#facc15; border:1px solid rgba(234,179,8,0.35); }
        .badge-resolved { background:rgba(34,197,94,0.15); color:#4ade80; border:1px solid rgba(34,197,94,0.35); }
    </style>
</head>
<body class="antialiased min-h-screen">

<!-- ══════════════════════════════════════════════════════════════════
     FIREBASE SETUP — same project as your main website.
     ADMIN_EMAILS below controls who is allowed to see tickets.
     Replace with the email(s) you actually sign in with as the owner.
     ══════════════════════════════════════════════════════════════════ -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAcbGk2LqXtHJMbDQvawg8BW3teZUjHBvE",
        authDomain: "lakkisstock-23692.firebaseapp.com",
        projectId: "lakkisstock-23692",
        storageBucket: "lakkisstock-23692.firebasestorage.app",
        messagingSenderId: "195238544522",
        appId: "1:195238544522:web:1d1b81f940ffbaf1cb1973"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ⚠️ EDIT THIS: only these email addresses can view tickets here.
    const ADMIN_EMAILS = ["lakkisr2@gmail.com"];
</script>

<div class="max-w-5xl mx-auto px-5 py-10">
    <div class="flex items-center justify-between mb-8">
        <div class="font-display font-bold text-2xl">
            <span class="bg-gradient-to-r from-red-600 via-purple-500 to-blue-500 bg-clip-text text-transparent">Lakkis</span>Stock
            <span class="text-sm text-gray-400 font-normal ml-2">Admin</span>
        </div>
        <button id="logoutBtn" class="hidden text-sm px-4 py-2 rounded-full border border-white/10 hover:border-red-400/50 hover:text-red-300 transition-all">Log Out</button>
    </div>

    <!-- LOGIN VIEW -->
    <div id="loginView" class="max-w-sm mx-auto glass rounded-2xl p-8 mt-16">
        <h1 class="font-display font-bold text-xl mb-1">Admin Sign In</h1>
        <p class="text-sm text-gray-400 mb-6">Sign in with your owner account.</p>
        <div id="loginError" class="hidden mb-4 px-4 py-2.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-sm"></div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
                <input type="email" id="loginEmail" required class="input-field w-full px-4 py-3 rounded-xl">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                <input type="password" id="loginPassword" required class="input-field w-full px-4 py-3 rounded-xl">
            </div>
            <button type="submit" class="w-full py-3 rounded-xl font-semibold bg-gradient-to-r from-purple-600 to-blue-600">Sign In</button>
        </form>
    </div>

    <!-- ACCESS DENIED VIEW -->
    <div id="deniedView" class="hidden max-w-sm mx-auto glass rounded-2xl p-8 mt-16 text-center">
        <h1 class="font-display font-bold text-xl mb-2 text-red-300">Access Denied</h1>
        <p class="text-sm text-gray-400">This account isn't authorized to view the admin dashboard.</p>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="hidden">
        <div class="flex flex-wrap items-center gap-3 mb-6">
            <button data-status="open" class="status-filter px-4 py-2 rounded-full text-sm font-semibold bg-white/10 border border-white/20">Open</button>
            <button data-status="resolved" class="status-filter px-4 py-2 rounded-full text-sm font-semibold border border-white/10 text-gray-400 hover:text-white">Resolved</button>
            <button data-status="all" class="status-filter px-4 py-2 rounded-full text-sm font-semibold border border-white/10 text-gray-400 hover:text-white">All</button>
            <span id="ticketCount" class="ml-auto text-sm text-gray-400"></span>
        </div>

        <div id="ticketsList" class="space-y-4"></div>
        <div id="emptyState" class="hidden text-center py-20 text-gray-500">No tickets here yet.</div>
        <div id="loadingState" class="text-center py-20 text-gray-500">Loading tickets...</div>
    </div>
</div>

<script>
    const loginView = document.getElementById('loginView');
    const deniedView = document.getElementById('deniedView');
    const dashboardView = document.getElementById('dashboardView');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginError = document.getElementById('loginError');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.classList.add('hidden');
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        try {
            await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
            loginError.textContent = err.message;
            loginError.classList.remove('hidden');
        }
    });

    logoutBtn.addEventListener('click', () => auth.signOut());

    let allTickets = [];
    let currentFilter = 'open';

    auth.onAuthStateChanged((user) => {
        [loginView, deniedView, dashboardView].forEach(v => v.classList.add('hidden'));
        if (!user) {
            logoutBtn.classList.add('hidden');
            loginView.classList.remove('hidden');
            return;
        }
        logoutBtn.classList.remove('hidden');
        if (!ADMIN_EMAILS.includes(user.email)) {
            deniedView.classList.remove('hidden');
            return;
        }
        dashboardView.classList.remove('hidden');
        loadTickets();
    });

    function loadTickets() {
        document.getElementById('loadingState').classList.remove('hidden');
        db.collection('supportTickets').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
            allTickets = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            document.getElementById('loadingState').classList.add('hidden');
            renderTickets();
        }, (err) => {
            document.getElementById('loadingState').textContent = 'Error loading tickets: ' + err.message;
        });
    }

    function renderTickets() {
        const list = document.getElementById('ticketsList');
        const empty = document.getElementById('emptyState');
        const filtered = currentFilter === 'all'
            ? allTickets
            : allTickets.filter(t => (t.status || 'open') === currentFilter);

        document.getElementById('ticketCount').textContent = `${filtered.length} ticket${filtered.length === 1 ? '' : 's'}`;

        if (filtered.length === 0) {
            list.innerHTML = '';
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');

        list.innerHTML = filtered.map(t => {
            const status = t.status || 'open';
            const date = t.createdAt?.toDate ? t.createdAt.toDate().toLocaleString() : '—';
            const who = t.name || t.email || 'Guest';
            return `
            <div class="ticket-card rounded-2xl p-5">
                <div class="flex flex-wrap items-start justify-between gap-2 mb-2">
                    <div>
                        <h3 class="font-semibold text-lg">${escapeHtml(t.subject || '(no subject)')}</h3>
                        <p class="text-xs text-gray-500 mt-0.5">${escapeHtml(who)} ${t.email ? '· ' + escapeHtml(t.email) : ''} · ${date}</p>
                    </div>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${status === 'resolved' ? 'badge-resolved' : 'badge-open'}">${status}</span>
                </div>
                <p class="text-sm text-gray-300 whitespace-pre-wrap mb-4">${escapeHtml(t.message || '')}</p>
                <div class="flex gap-2">
                    ${status !== 'resolved'
                        ? `<button onclick="setStatus('${t.id}','resolved')" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-green-500/10 border border-green-500/30 text-green-300 hover:bg-green-500/20 transition-all">Mark Resolved</button>`
                        : `<button onclick="setStatus('${t.id}','open')" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-yellow-500/10 border border-yellow-500/30 text-yellow-300 hover:bg-yellow-500/20 transition-all">Reopen</button>`}
                    ${t.email ? `<a href="mailto:${encodeURIComponent(t.email)}" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:border-white/25 transition-all">Reply by Email</a>` : ''}
                </div>
            </div>`;
        }).join('');
    }

    async function setStatus(id, status) {
        try {
            await db.collection('supportTickets').doc(id).update({ status });
        } catch (err) {
            alert('Could not update ticket: ' + err.message);
        }
    }

    document.querySelectorAll('.status-filter').forEach(btn => {
        btn.addEventListener('click', () => {
            currentFilter = btn.dataset.status;
            document.querySelectorAll('.status-filter').forEach(b => {
                b.classList.remove('bg-white/10', 'border-white/20', 'text-white');
                b.classList.add('border-white/10', 'text-gray-400');
            });
            btn.classList.add('bg-white/10', 'border-white/20', 'text-white');
            btn.classList.remove('text-gray-400');
            renderTickets();
        });
    });

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
</body>
</html>
